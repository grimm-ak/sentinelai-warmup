<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelAI | Connecting</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d18;
      color: #e5edf9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(90%, 460px);
      padding: 36px;
      text-align: center;
      border: 1px solid #25334a;
      border-radius: 18px;
      background: #101827;
    }
    .logo { font-size: 38px; margin-bottom: 12px; }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { color: #9eafc7; line-height: 1.6; }
    .status { margin: 24px 0; color: #67e8a5; }
    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      text-decoration: none;
    }
    #actions { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="logo">◈</div>
    <h1>SentinelAI</h1>
    <p>Machine-learning-powered network intrusion detection.</p>
    <div class="status" id="status">Connecting to detection service…</div>
    <p id="detail">The backend may take a little longer to start after inactivity.</p>

    <div id="actions">
      <p>Automatic connection didn't work. You can open either service manually:</p>
      <p>
        <a href="https://sentinelai-api-dbuv.onrender.com/health"
           target="_blank" rel="noopener noreferrer">
          Open Backend Health Check
        </a>
      </p>
      <p>
        <a href="https://sentinel-ai-silk-seven.vercel.app/"
           target="_blank" rel="noopener noreferrer">
          Open SentinelAI Dashboard
        </a>
      </p>
    </div>
  </main>

  <script>
    const API = "https://sentinelai-api-dbuv.onrender.com";
    const DASHBOARD = "https://sentinel-ai-silk-seven.vercel.app/";
    const statusEl = document.getElementById("status");
    const detailEl = document.getElementById("detail");
    const actionsEl = document.getElementById("actions");

    let attempts = 0;
    const maxAttempts = 5;

    async function checkBackend() {
      attempts++;
      statusEl.textContent = `Connecting to backend… (attempt ${attempts})`;

      try {
        const response = await fetch(`${API}/health`, {
          cache: "no-store",
          signal: AbortSignal.timeout(20000)
        });

        if (response.ok) {
          statusEl.textContent = "Backend responded. Opening dashboard…";
          detailEl.textContent = "Redirecting to SentinelAI.";
          setTimeout(() => {
            window.location.replace(DASHBOARD);
          }, 800);
          return;
        }
      } catch (error) {
        // Retry when the request fails or times out.
      }

      if (attempts < maxAttempts) {
        detailEl.textContent =
          "Waiting for the service to respond. Please keep this page open.";
        setTimeout(checkBackend, 3000);
      } else {
        statusEl.textContent = "Automatic connection failed";
        detailEl.textContent =
          "Choose either link below to continue manually.";
        actionsEl.style.display = "block";
      }
    }

    checkBackend();
  </script>
</body>
</html>
